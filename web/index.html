<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0a0b0d">
  <meta name="color-scheme" content="dark">
  <!--OG-->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://www.youtube-nocookie.com">
  <link rel="preconnect" href="https://i.ytimg.com">
  <link rel="preload" href="/assets/__FONT__" as="font" type="font/woff2" crossorigin>
  <link rel="modulepreload" href="/assets/__JS__">
  __PRELOAD__
  <style>__CSS__</style>
</head>
<body>
  <div id="app" class="app">
    <div class="stage" id="stage">
      <div class="backdrop" id="backdrop"></div>
      <div class="yt" id="yt"></div>
      <div class="poster" id="poster"></div>
      <div class="scrim" id="scrim"></div>
      <div class="tapcatch" id="tapcatch"></div>
    </div>
    <header class="top" id="top"></header>
    <main class="deck" id="deck"></main>
    <div id="sheets"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <noscript><p style="padding:24px;color:#fff;font-family:sans-serif">DailyClips needs JavaScript.</p></noscript>
  <!--BOOT-->
  <script type="module" src="/assets/__JS__"></script>
</body>
</html>
